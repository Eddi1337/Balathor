services:
  balathor-server:
    build:
      context: ./server
    image: balathor-server:latest
    container_name: balathor-server
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      ACCOUNT_STORE_PATH: /data/accounts.json
    ports:
      - "8080:8080"
    volumes:
      - balathor-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
  balathor-client:
    build:
      context: ./client
    image: balathor-client:latest
    container_name: balathor-client
    restart: unless-stopped
    environment:
      CLIENT_HOST: 0.0.0.0
      CLIENT_PORT: 3000
      GAME_SERVER_URL: ws://localhost:8080/ws
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  balathor-data:
