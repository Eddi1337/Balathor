<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Balathor</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <canvas id="game" width="1280" height="720" aria-label="Balathor game world"></canvas>

    <section id="boot" class="panel">
      <div class="brand">
        <span class="mark"></span>
        <h1>Balathor</h1>
      </div>

      <div id="status" class="status">Loading realm config</div>

      <form id="accountForm" class="character hidden">
        <label>
          <span>Username</span>
          <input id="usernameInput" autocomplete="username">
        </label>

        <label>
          <span>Password</span>
          <input id="passwordInput" type="password" autocomplete="current-password">
        </label>

        <div class="account-actions">
          <button id="loginButton" class="connect" type="submit" value="login">Log In</button>
          <button id="createAccountButton" class="segment" type="submit" value="create">Create</button>
        </div>
      </form>

      <form id="characterForm" class="character hidden">
        <label>
          <span>Name</span>
          <input id="nameInput" maxlength="18" value="Wanderer" autocomplete="off">
        </label>

        <fieldset>
          <legend>Class</legend>
          <div class="segments" role="radiogroup" aria-label="Class">
            <button type="button" class="segment selected" data-class="ranger">Ranger</button>
            <button type="button" class="segment" data-class="mage">Mage</button>
            <button type="button" class="segment" data-class="knight">Knight</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Torso</legend>
          <div class="segments" role="radiogroup" aria-label="Torso style">
            <button type="button" class="segment selected" data-torso-style="tunic">Tunic</button>
            <button type="button" class="segment" data-torso-style="armor">Armour</button>
            <button type="button" class="segment" data-torso-style="robe">Robe</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Torso Colour</legend>
          <div class="swatches" data-target="torsoColor">
            <button type="button" class="swatch selected" style="--swatch: #5cc8ff" data-color="#5cc8ff" aria-label="sky"></button>
            <button type="button" class="swatch" style="--swatch: #8bd346" data-color="#8bd346" aria-label="leaf"></button>
            <button type="button" class="swatch" style="--swatch: #f26d6d" data-color="#f26d6d" aria-label="ember"></button>
            <button type="button" class="swatch" style="--swatch: #c79cff" data-color="#c79cff" aria-label="arcane"></button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Weapon</legend>
          <div class="segments" role="radiogroup" aria-label="Weapon style">
            <button type="button" class="segment selected" data-weapon-style="classic">Classic</button>
            <button type="button" class="segment" data-weapon-style="heavy">Heavy</button>
            <button type="button" class="segment" data-weapon-style="ornate">Ornate</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Weapon Colour</legend>
          <div class="swatches" data-target="weaponColor">
            <button type="button" class="swatch selected" style="--swatch: #ffd166" data-color="#ffd166" aria-label="gold"></button>
            <button type="button" class="swatch" style="--swatch: #ffffff" data-color="#ffffff" aria-label="white"></button>
            <button type="button" class="swatch" style="--swatch: #2ef3c5" data-color="#2ef3c5" aria-label="teal"></button>
            <button type="button" class="swatch" style="--swatch: #202437" data-color="#202437" aria-label="ink"></button>
          </div>
        </fieldset>

        <button id="playButton" class="play" type="submit">Play</button>
      </form>
    </section>

    <aside id="hud" class="hud hidden">
      <strong>Balathor</strong>
      <span id="population">0 online</span>
      <span id="position">0, 0</span>
    </aside>

    <aside id="progression" class="progression hidden" aria-label="Progression">
      <div class="progress-head">
        <strong id="levelText">Level 1</strong>
        <span id="statPoints">0 points</span>
      </div>
      <div class="xp-track" aria-hidden="true">
        <span id="xpFill"></span>
      </div>
      <span id="xpText" class="xp-text">0 / 100 XP</span>
      <div class="stat-grid">
        <button type="button" data-stat="speed">Speed <span id="statSpeed">0</span></button>
        <button type="button" data-stat="strength">Strength <span id="statStrength">0</span></button>
        <button type="button" data-stat="armour">Armour <span id="statArmour">0</span></button>
        <button type="button" data-stat="health">Health <span id="statHealth">0</span></button>
      </div>
      <div class="window-actions">
        <button id="equipmentButton" type="button">Equipment</button>
        <button id="bagsButton" type="button">Bags</button>
      </div>
    </aside>

    <aside id="equipmentPanel" class="game-window equipment-window hidden" aria-label="Equipment">
      <div class="window-head">
        <strong>Equipment</strong>
        <button id="equipmentClose" class="window-close" type="button" aria-label="Close equipment">Close</button>
      </div>
      <div id="equipmentSlots" class="equipment-slots"></div>
    </aside>

    <aside id="bagsPanel" class="game-window bags-window hidden" aria-label="Bags">
      <div class="window-head">
        <strong>Bags</strong>
        <button id="bagsClose" class="window-close" type="button" aria-label="Close bags">Close</button>
      </div>
      <div id="nearbyLoot" class="nearby-loot"></div>
      <div id="inventorySlots" class="inventory-slots"></div>
      <button id="interactButton" class="interact-button" type="button">Open / Pick Up</button>
    </aside>

    <section id="chat" class="chat hidden" aria-label="Realm chat">
      <div class="chat-head">
        <strong>Chat</strong>
        <button id="chatToggle" class="chat-toggle" type="button" aria-expanded="true">Minimize</button>
      </div>
      <div id="chatMessages" class="chat-messages"></div>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" maxlength="180" placeholder="Message" autocomplete="off">
        <button class="chat-send" type="submit">Send</button>
      </form>
    </section>

    <section id="mobileControls" class="mobile-controls hidden" aria-label="Mobile controls">
      <div class="mobile-dpad">
        <button type="button" data-mobile-move="up" class="mobile-up" aria-label="Move up">Up</button>
        <button type="button" data-mobile-move="left" class="mobile-left" aria-label="Move left">Left</button>
        <button type="button" data-mobile-move="down" class="mobile-down" aria-label="Move down">Down</button>
        <button type="button" data-mobile-move="right" class="mobile-right" aria-label="Move right">Right</button>
      </div>
      <div class="mobile-actions">
        <button type="button" data-mobile-action="home">Home</button>
        <button type="button" data-mobile-action="attack">Attack</button>
      </div>
    </section>

    <aside id="menu" class="menu hidden" aria-hidden="true">
      <div class="menu-panel">
        <div class="menu-head">
          <strong>Menu</strong>
          <button id="resumeButton" class="menu-close" type="button">Resume</button>
        </div>

        <form id="serverForm" class="menu-section">
          <label>
            <span>Server URL</span>
            <input id="menuServerUrlInput" autocomplete="off" spellcheck="false">
          </label>
          <button class="menu-apply" type="submit">Change Server</button>
        </form>

        <div class="menu-section">
          <button type="button" id="debugToggleButton" class="menu-debug-toggle" aria-pressed="false">
            Debug overlay: Off
          </button>
        </div>
      </div>
    </aside>

    <script src="./src/main.js"></script>
  </body>
</html>
