<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Balathor</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <canvas id="game" width="1280" height="720" aria-label="Balathor game world"></canvas>

    <section id="boot" class="panel">
      <div class="brand">
        <span class="mark"></span>
        <h1>Balathor</h1>
      </div>

      <div id="status" class="status">Loading realm config</div>

      <form id="accountForm" class="character hidden">
        <label>
          <span>Username</span>
          <input id="usernameInput" autocomplete="username">
        </label>

        <label>
          <span>Password</span>
          <input id="passwordInput" type="password" autocomplete="current-password">
        </label>

        <div class="account-actions">
          <button id="loginButton" class="connect" type="submit" value="login">Log In</button>
          <button id="createAccountButton" class="segment" type="submit" value="create">Create</button>
        </div>
      </form>

      <form id="characterForm" class="character hidden">
        <label>
          <span>Name</span>
          <input id="nameInput" maxlength="18" value="Wanderer" autocomplete="off">
        </label>

        <fieldset>
          <legend>Class</legend>
          <div class="segments" role="radiogroup" aria-label="Class">
            <button type="button" class="segment selected" data-class="ranger">Ranger</button>
            <button type="button" class="segment" data-class="mage">Mage</button>
            <button type="button" class="segment" data-class="knight">Knight</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Torso</legend>
          <div class="segments" role="radiogroup" aria-label="Torso style">
            <button type="button" class="segment selected" data-torso-style="tunic">Tunic</button>
            <button type="button" class="segment" data-torso-style="armor">Armour</button>
            <button type="button" class="segment" data-torso-style="robe">Robe</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Torso Colour</legend>
          <div class="swatches" data-target="torsoColor">
            <button type="button" class="swatch selected" style="--swatch: #5cc8ff" data-color="#5cc8ff" aria-label="sky"></button>
            <button type="button" class="swatch" style="--swatch: #8bd346" data-color="#8bd346" aria-label="leaf"></button>
            <button type="button" class="swatch" style="--swatch: #f26d6d" data-color="#f26d6d" aria-label="ember"></button>
            <button type="button" class="swatch" style="--swatch: #c79cff" data-color="#c79cff" aria-label="arcane"></button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Weapon</legend>
          <div class="segments" role="radiogroup" aria-label="Weapon style">
            <button type="button" class="segment selected" data-weapon-style="classic">Classic</button>
            <button type="button" class="segment" data-weapon-style="heavy">Heavy</button>
            <button type="button" class="segment" data-weapon-style="ornate">Ornate</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Weapon Colour</legend>
          <div class="swatches" data-target="weaponColor">
            <button type="button" class="swatch selected" style="--swatch: #ffd166" data-color="#ffd166" aria-label="gold"></button>
            <button type="button" class="swatch" style="--swatch: #ffffff" data-color="#ffffff" aria-label="white"></button>
            <button type="button" class="swatch" style="--swatch: #2ef3c5" data-color="#2ef3c5" aria-label="teal"></button>
            <button type="button" class="swatch" style="--swatch: #202437" data-color="#202437" aria-label="ink"></button>
          </div>
        </fieldset>

        <button id="playButton" class="play" type="submit">Play</button>
      </form>
    </section>

    <aside id="progression" class="progression hidden" aria-label="Progression">
      <div class="progression-head">
        <strong id="levelText">Level 1</strong>
        <span id="goldText" class="gold-text">0g</span>
        <button id="progressionToggle" class="progression-toggle" type="button" aria-expanded="true" aria-label="Minimize stats">&#8722;</button>
      </div>
      <div class="progression-body">
        <div class="hp-stack" aria-label="Hit points">
          <div class="hp-track"><span id="hpFill"></span></div>
          <span id="hpText" class="hp-text">— / — HP</span>
        </div>
        <div class="progress-head">
          <span id="statPoints">0 points</span>
        </div>
        <div class="xp-track" aria-hidden="true">
          <span id="xpFill"></span>
        </div>
        <span id="xpText" class="xp-text">0 / 100 XP</span>
        <div class="window-actions">
          <button id="equipmentButton" type="button">Character</button>
          <button id="bagsButton" type="button">Bags</button>
        </div>
      </div>
    </aside>

    <aside id="equipmentPanel" class="game-window equipment-window hidden" aria-label="Character">
      <div class="window-head">
        <strong>Character</strong>
        <button id="equipmentClose" class="window-close" type="button" aria-label="Close character">Close</button>
      </div>
      <div class="equip-layout">
        <div class="equip-slots-left" id="equipSlotsLeft"></div>
        <div class="equip-center">
          <canvas id="charPreview" width="80" height="110" aria-label="Character preview"></canvas>
          <div id="charStats" class="char-stats"></div>
        </div>
        <div class="equip-slots-right" id="equipSlotsRight"></div>
      </div>
      <div style="padding:8px 10px 10px;">
        <button id="talentsButton" class="talents-open-btn" type="button">Talents (T)</button>
      </div>
    </aside>

    <aside id="talentPanel" class="game-window talent-window hidden" aria-label="Talents">
      <div class="window-head">
        <strong>Talents</strong>
        <button id="talentClose" class="window-close" type="button" aria-label="Close talents">Close</button>
      </div>
      <div class="talent-section">
        <div class="talent-header">
          <span id="talentPointsText" class="talent-points-label">0 talent points</span>
          <div id="talentTabs" class="talent-tabs"></div>
        </div>
        <div class="talent-xp-track"><div id="talentProgressFill" class="talent-xp-fill"></div></div>
        <div id="talentTree" class="talent-tree"></div>
      </div>
    </aside>

    <div id="abilityBar" class="ability-bar hidden" aria-label="Ability bar">
      <button id="abilityBarToggle" class="ability-bar-toggle" type="button" title="Minimise">&#8722;</button>
      <div id="abilitySlots" class="ability-slots">
        <div class="ability-slot" data-slot="0"><span class="ability-key">1</span></div>
        <div class="ability-slot" data-slot="1"><span class="ability-key">2</span></div>
        <div class="ability-slot" data-slot="2"><span class="ability-key">3</span></div>
        <div class="ability-slot" data-slot="3"><span class="ability-key">4</span></div>
        <div class="ability-slot" data-slot="4"><span class="ability-key">5</span></div>
      </div>
      <div class="ability-bar-divider"></div>
      <div id="potionSlot" class="ability-slot potion-slot" title="Health Potion (Q)">
        <canvas id="potionSlotIcon" width="32" height="32" style="position:absolute;top:4px;left:50%;transform:translateX(-50%);image-rendering:pixelated;"></canvas>
        <span class="ability-key potion-key">Q</span>
        <span id="potionCount" class="potion-count">0</span>
      </div>
    </div>

    <aside id="bagsPanel" class="game-window bags-window hidden" aria-label="Bags">
      <div class="window-head">
        <strong>Bags</strong>
        <button id="bagsClose" class="window-close" type="button" aria-label="Close bags">Close</button>
      </div>
      <div id="nearbyLoot" class="nearby-loot"></div>
      <div id="inventorySlots" class="inventory-slots"></div>
      <button id="interactButton" class="interact-button" type="button">Open / Pick Up</button>
    </aside>

    <aside id="shopPanel" class="game-window shop-window hidden" aria-label="Trader shelf">
      <div class="window-head">
        <strong id="shopTitle">Trader Shelf</strong>
        <button id="shopClose" class="window-close" type="button" aria-label="Close trader shelf">Close</button>
      </div>
      <div id="shopGold" class="shop-gold">0 gold</div>
      <div class="shop-columns">
        <section>
          <span>Buy</span>
          <div id="shopBuyList" class="shop-list"></div>
        </section>
        <section>
          <span>Sell</span>
          <div id="shopSellList" class="shop-list"></div>
        </section>
      </div>
    </aside>

    <aside id="traderPanel" class="game-window trader-window hidden" aria-label="Trader">
      <div class="window-head">
        <strong id="traderTitle">Trader</strong>
        <button id="traderClose" class="window-close" type="button" aria-label="Close trader">Close</button>
      </div>
      <div id="traderStock" class="trader-stock"></div>
      <div class="trader-sell-head"><strong>Sell from inventory</strong></div>
      <div id="traderSellSlots" class="inventory-slots"></div>
    </aside>

    <section id="chat" class="chat hidden" aria-label="Realm chat">
      <button id="chatIconBtn" class="chat-icon-btn" type="button" aria-label="Open chat"></button>
      <div class="chat-head">
        <strong>Chat</strong>
        <button id="chatToggle" class="chat-toggle" type="button" aria-expanded="true">Minimize</button>
      </div>
      <div id="chatMessages" class="chat-messages"></div>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" maxlength="180" placeholder="Message" autocomplete="off">
        <button class="chat-send" type="submit">Send</button>
      </form>
    </section>

    <section id="mobileControls" class="mobile-controls hidden" aria-label="Mobile controls">
      <canvas id="joystick" class="mobile-joystick" width="140" height="140" aria-label="Movement joystick"></canvas>
      <div class="mobile-actions">
        <button type="button" data-mobile-action="home">Home</button>
        <button type="button" data-mobile-action="attack">Attack</button>
      </div>
    </section>

    <aside id="menu" class="menu hidden" aria-hidden="true">
      <div class="menu-panel">
        <header class="menu-session" aria-label="Session">
          <div class="menu-session-title" id="menuServerLabel">—</div>
          <div class="menu-session-meta">
            <span id="menuPopulation">0 online</span>
            <span class="menu-session-sep" aria-hidden="true">·</span>
            <span id="menuPosition">0, 0</span>
          </div>
        </header>
        <div class="menu-head">
          <strong>Menu</strong>
          <button id="resumeButton" class="menu-close" type="button">Resume</button>
        </div>

        <form id="serverForm" class="menu-section">
          <label>
            <span>Server URL</span>
            <input id="menuServerUrlInput" autocomplete="off" spellcheck="false">
          </label>
          <button class="menu-apply" type="submit">Change Server</button>
        </form>

        <div class="menu-section">
          <button type="button" id="debugToggleButton" class="menu-debug-toggle" aria-pressed="false">
            Debug overlay: Off
          </button>
        </div>
      </div>
    </aside>

    <div id="cast-bar">
      <span id="cast-bar-label">Casting: Home</span>
      <div id="cast-bar-track"><div id="cast-bar-fill"></div></div>
    </div>

    <script src="./src/main.js"></script>
  </body>
</html>
