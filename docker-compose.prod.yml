# Production deployment for Balathor v2. Runs alongside v1 (ports 8082/8083) as its own
# compose project with its own data volume, so the two never touch each other.
name: balathor-v2

services:
  balathor-v2:
    image: harbor.edmundmurphy.com/balathor/v2:${IMAGE_TAG:-latest}
    container_name: balathor-v2
    restart: unless-stopped
    environment:
      PORT: 8080
      DATA_DIR: /app/data
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    ports:
      - "8084:8080"
    volumes:
      - balathor-v2-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  balathor-v2-data:
