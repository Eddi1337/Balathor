name: Build and Deploy v2

on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - v2

env:
  REGISTRY: harbor.edmundmurphy.com
  IMAGE_REPOSITORY: balathor/v2
  DEPLOY_HOST: 192.168.10.112
  DEPLOY_PATH: /root/balathor-v2

jobs:
  test:
    # Runs on the self-hosted Balathor runner so deploys never wait on hosted-runner queues.
    runs-on:
      - self-hosted
      - linux
      - x64
      - balathor
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  build-and-deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on:
      - self-hosted
      - linux
      - x64
      - balathor
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build image
        run: |
          docker build \
            -t "${REGISTRY}/${IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            -t "${REGISTRY}/${IMAGE_REPOSITORY}:latest" \
            .

      - name: Push image
        run: |
          docker push "${REGISTRY}/${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          docker push "${REGISTRY}/${IMAGE_REPOSITORY}:latest"

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Sync production compose file
        run: |
          ssh -o StrictHostKeyChecking=accept-new root@${DEPLOY_HOST} "mkdir -p ${DEPLOY_PATH}"
          scp -o StrictHostKeyChecking=accept-new docker-compose.prod.yml root@${DEPLOY_HOST}:${DEPLOY_PATH}/docker-compose.yml

      - name: Deploy on remote host
        env:
          IMAGE_TAG: ${{ github.sha }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new root@${DEPLOY_HOST} "\
            docker login ${REGISTRY} -u '${HARBOR_USERNAME}' -p '${HARBOR_PASSWORD}' && \
            IMAGE_TAG='${IMAGE_TAG}' docker compose -f ${DEPLOY_PATH}/docker-compose.yml pull && \
            IMAGE_TAG='${IMAGE_TAG}' docker compose -f ${DEPLOY_PATH}/docker-compose.yml up -d"

      - name: Verify health
        run: |
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=accept-new root@${DEPLOY_HOST} "curl -fsS http://127.0.0.1:8084/health"; then exit 0; fi
            sleep 2
          done
          echo "v2 did not become healthy" >&2
          exit 1
