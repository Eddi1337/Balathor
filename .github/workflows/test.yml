name: Local tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run local server and UI tests
        run: npm test
